name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore Listmate.slnx
      - run: dotnet format Listmate.slnx --verify-no-changes --no-restore
      - run: dotnet build Listmate.slnx -c Release --no-restore -warnaserror
      # Includes the Testcontainers integration tests (Docker is available on ubuntu-latest).
      - run: dotnet test Listmate.slnx -c Release --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: scripts/smoke.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  scale:
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: src/Web
      - run: docker compose -f compose.yaml -f compose.scale.yaml up -d --build --wait
      - run: node scripts/scale-smoke.mjs
      - run: scripts/smoke.sh
      - if: failure()
        run: docker compose -f compose.yaml -f compose.scale.yaml logs
      - if: always()
        run: docker compose -f compose.yaml -f compose.scale.yaml down -v
