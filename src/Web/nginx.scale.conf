# nginx.conf for the scale-out profile: round-robin over two API replicas, no sticky sessions.
upstream listmate_api {
  server api:8080;
  server api-b:8080;
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz { return 200 "ok\n"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  location /api/ {
    proxy_pass http://listmate_api;
    add_header X-Listmate-Upstream $upstream_addr always;
  }

  location /hubs/ {
    proxy_pass http://listmate_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  location / { try_files $uri /index.html; }
}
